[project]
name = "secq-operator"
version = "0.1.0"
description = "Autonomous AI operator prototype for security questionnaires"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
    "openpyxl>=3.1.2",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

